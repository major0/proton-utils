repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: no-go-testing
  # Local hooks replace two upstream dnephin hooks whose hard-coded flags are
  # wrong for this repository.
  #
  # golangci-lint: upstream hard-codes --new-from-rev HEAD, which in CI diffs
  # the pull request head against itself and so blames a pull request for
  # pre-existing findings anywhere in the module. lint_diff.py uses the refs
  # pre-commit already exports so CI compares against the pull request base.
  # It is Python rather than shell because pre-commit guarantees Python and
  # this repository is built for Windows as well as Unix.
  #
  # go-unit-tests: upstream hard-codes a 30s timeout (too short for
  # property-based tests on cold cache) and uses -v (produces enormous
  # race-detector noise from go-fuse).
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: python .github/scripts/lint_diff.py
        language: python
        pass_filenames: false
        types: [go]
        require_serial: true
      - id: go-unit-tests
        name: go unit tests
        entry: go test -short -timeout 120s -count=1 ./...
        language: system
        pass_filenames: false
        types: [go]
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
